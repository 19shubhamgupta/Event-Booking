name: Deploy booking-service

on:
  push:
    branches:
      - main
    paths:
      - 'booking-service/**'
      - '.github/workflows/deploy-booking-service.yaml'

env:
  ACR_NAME: eventbookingacr
  ACR_LOGIN_SERVER: eventbookingacr.azurecr.io
  IMAGE_NAME: booking-service
  RESOURCE_GROUP: event-booking-rg
  CLUSTER_NAME: event-booking-cluster

jobs:
  test:
    name: Validate & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: booking-service/package-lock.json

      - name: Install dependencies
        working-directory: ./booking-service
        run: npm ci

      - name: Dependency vulnerabilities
        working-directory: ./booking-service
        run: npm audit --audit-level=high
        
  build-and-push:
    name: Build and push image to ACR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        working-directory: ./booking-service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Push image
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to AKS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CLUSTER_NAME }} --overwrite-existing

      - name: Deploy new image
        run: |
          kubectl set image deployment/booking-service booking-service=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl rollout status deployment/booking-service --timeout=120s