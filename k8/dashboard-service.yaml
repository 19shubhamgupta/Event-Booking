apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-service
  template:
    metadata:
      labels:
        app: dashboard-service
    spec:
      containers:
        - name: dashboard-service
          image: eventbookingacr.azurecr.io/dashboard-service:latest
          ports:
            - containerPort: 5007
          envFrom:
            - secretRef:
                name: dashboard-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5007
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5007
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  selector:
    app: dashboard-service
  ports:
    - port: 5007
      targetPort: 5007
  type: ClusterIP