apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-discovery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-discovery
  template:
    metadata:
      labels:
        app: event-discovery
    spec:
      containers:
        - name: event-discovery
          image: eventbookingacr.azurecr.io/event-discovery:latest
          ports:
            - containerPort: 5004
          envFrom:
            - secretRef:
                name: event-discovery-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: event-discovery
spec:
  selector:
    app: event-discovery
  ports:
    - port: 5004
      targetPort: 5004
  type: ClusterIP