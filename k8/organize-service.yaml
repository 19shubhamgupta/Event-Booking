apiVersion: apps/v1
kind: Deployment
metadata:
  name: organize-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: organize-service
  template:
    metadata:
      labels:
        app: organize-service
    spec:
      containers:
        - name: organize-service
          image: eventbookingacr.azurecr.io/organize-service:latest
          ports:
            - containerPort: 5003
          envFrom:
            - secretRef:
                name: organize-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: organize-service
spec:
  selector:
    app: organize-service
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP